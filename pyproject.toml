[project]
name = "gemini-web2api"
version = "1.3.0"
description = "Convert Google Gemini web into OpenAI-compatible API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.25",
    "curl_cffi>=0.16",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
gemini-web2api = "gemini_web2api.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py38"
src = ["src", "tests"]

[tool.ruff.lint]
# Curated rule set: correctness plus low-churn style groups. Opinionated
# rewrites (ternary push, %-format conversion) stay off; lazy imports are
# a deliberate cycle-avoidance pattern in this codebase.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RET", "RUF"]
ignore = [
    "E501",   # long log strings kept where they aid readability
    "SIM105", # try/except around one call reads clearer than contextlib
    "SIM108", # ternary rewrites hurt readability on multi-line conditions
    "SIM117", # nested with-blocks kept for diff clarity
    "UP031",  # %-formatting is load-bearing in the JS template strings
    "RUF001", "RUF002", "RUF003",  # Chinese log/comment text is intentional
]

[tool.ruff.lint.per-file-ignores]
# tests: loop-variable lambdas and explicit file handles are intentional
"tests/**" = ["B023", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
